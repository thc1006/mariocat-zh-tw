<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貓利歐：屎喔棒大冒險（瀏覽器版）</title>
<meta name="description" content="日本經典整人遊戲 Syobon Action 繁體中文化版的瀏覽器試玩版本。">
<link rel="icon" type="image/png" href="../player.png">

<!-- Service Worker 偽造 COOP/COEP headers（GitHub Pages 沒辦法自送 header） -->
<script src="coi-serviceworker.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: #0a0a14;
    color: #f5f5f5;
    font-family: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    height: 100%;
    overflow: hidden;
}
.wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
}
header {
    text-align: center;
    margin-bottom: 1rem;
}
h1 {
    font-size: 1.4rem;
    color: #ffc850;
    letter-spacing: 0.1em;
    margin-bottom: 0.3rem;
}
.subtitle { color: #888; font-size: 0.85rem; }
.warning {
    background: #2a1a1a;
    color: #ffaa66;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    font-size: 0.85rem;
    margin-bottom: 1rem;
    max-width: 480px;
    text-align: center;
}
canvas {
    display: block;
    background: #000;
    border: 2px solid #333;
    image-rendering: pixelated;
    max-width: 100%;
    height: auto;
}
.status {
    margin-top: 1rem;
    color: #aaa;
    font-size: 0.9rem;
    text-align: center;
}
.status.error { color: #ff6666; }
.bar {
    width: 480px;
    max-width: 100%;
    height: 6px;
    background: #222;
    border-radius: 3px;
    margin-top: 0.5rem;
    overflow: hidden;
}
.bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffc850, #ff8c42);
    width: 0%;
    transition: width 0.2s;
}
footer {
    margin-top: 1rem;
    color: #666;
    font-size: 0.8rem;
    text-align: center;
}
footer a { color: #6cf; text-decoration: none; }
footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>貓利歐：屎喔棒大冒險</h1>
        <p class="subtitle">瀏覽器版 · 經典整人遊戲</p>
    </header>

    <div class="warning">
        ⚠ 點擊畫面後，鍵盤輸入才會被遊戲接收 · 第一次載入需要等 wasm bundle 下載（約 5 MB）
    </div>

    <!-- 480×420 對齊 DxLib SetGraphMode(fxmax/100, fymax/100) → 480×420
         PROXY_TO_PTHREAD 模式下 worker 沒辦法改 main thread 的 canvas size，
         所以一定要在 HTML 裡寫死 width/height attribute -->
    <canvas id="canvas" width="480" height="420" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div class="status" id="status">準備載入…</div>
    <div class="bar"><div class="bar-fill" id="progress"></div></div>

    <footer>
        © 2007 ちく · 原作 freeware ｜ © 2026 thc1006 · 中文化 MIT
        ｜ <a href="../">回首頁</a>
        ｜ <a href="https://github.com/thc1006/mariocat-zh-tw">原始碼</a>
    </footer>
</div>

<script>
const statusEl = document.getElementById('status');
const progressEl = document.getElementById('progress');

var Module = {
    canvas: (function() {
        const c = document.getElementById('canvas');
        c.addEventListener("webglcontextlost", e => {
            statusEl.classList.add('error');
            statusEl.textContent = 'WebGL context 掉了，請 refresh 頁面';
            e.preventDefault();
        }, false);
        return c;
    })(),
    setStatus: function(text) {
        if (!text) {
            statusEl.textContent = '✓ 遊戲已載入，點擊畫面後用鍵盤操作';
            progressEl.style.width = '100%';
            return;
        }
        const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) {
            const cur = parseFloat(m[2]);
            const total = parseFloat(m[4]);
            const pct = (cur / total * 100).toFixed(1);
            statusEl.textContent = `${m[1].trim()} ${pct}%`;
            progressEl.style.width = pct + '%';
        } else {
            statusEl.textContent = text;
        }
    },
    print: function(text) { console.log('[wasm]', text); },
    printErr: function(text) { console.error('[wasm]', text); },
    totalDependencies: 0,
    monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
    },
};

window.onerror = (msg) => {
    statusEl.classList.add('error');
    statusEl.textContent = '⚠ 載入失敗：' + msg;
};
</script>
{{{ SCRIPT }}}
</body>
</html>
