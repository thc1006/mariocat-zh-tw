<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>貓利歐：屎喔棒大冒險（瀏覽器版）</title>
<meta name="description" content="日本經典整人遊戲 Cat Mario / Syobon Action 繁體中文化版，純 JS 移植，瀏覽器直接玩。">
<link rel="icon" type="image/png" href="res/player.PNG">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
    background: #0a0a14;
    color: #f5f5f5;
    font-family: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    height: 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}
.root { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 0.5rem; }
header { text-align: center; margin-bottom: 0.4rem; }
h1 { font-size: 1.1rem; color: #ffc850; letter-spacing: 0.1em; }
.sub { color: #888; font-size: 0.78rem; }

.frame {
    position: relative;
    background: #000;
    border: 2px solid #333;
    box-shadow: 0 0 30px rgba(255,200,80,0.15);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 100%;
}
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

#status {
    margin-top: 0.4rem;
    color: #aaa;
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2em;
}
#status.taunt { color: #ffc850; font-weight: bold; }

/* 行動裝置觸控操作 */
.touch {
    margin-top: 0.6rem;
    display: none;
    gap: 0.5rem;
    touch-action: manipulation;
}
.touch button {
    width: 60px; height: 60px;
    background: #1a1a25;
    border: 2px solid #555;
    border-radius: 8px;
    color: #ffc850;
    font-size: 1.2rem;
    font-weight: bold;
    user-select: none;
}
.touch button:active { background: #ffc850; color: #000; }
.touch .pad { display: flex; gap: 0.3rem; }
.touch .actions { display: flex; gap: 0.3rem; margin-left: 1rem; }

@media (hover: none) and (pointer: coarse) {
    .touch { display: flex; }
}

footer { margin-top: 0.6rem; text-align: center; color: #666; font-size: 0.75rem; }
footer a { color: #6cf; text-decoration: none; }

/* 開始覆蓋畫面（瀏覽器 autoplay policy 要求 click 才能啟動 audio） */
.start-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 10;
}
.start-overlay h2 { color: #ffc850; font-size: 1.3rem; margin-bottom: 0.5rem; }
.start-overlay p { color: #ddd; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="root">
    <header>
        <h1>貓利歐：屎喔棒大冒險</h1>
        <p class="sub">瀏覽器版（純 JS 移植）· 鍵盤 ←→ 移動、↑/Z 跳、O 自殺、F1 回標題</p>
    </header>

    <div class="frame" id="frame">
        <canvas id="canvas" width="480" height="420"></canvas>
        <div class="start-overlay" id="startOverlay">
            <h2>點此開始</h2>
            <p>（瀏覽器需要點一下才會放音樂）</p>
        </div>
    </div>

    <div id="status">準備好了嗎？</div>

    <div class="touch" id="touch">
        <div class="pad">
            <button data-key="ArrowLeft">←</button>
            <button data-key="ArrowRight">→</button>
        </div>
        <div class="actions">
            <button data-key="KeyZ">跳</button>
            <button data-key="KeyO">死</button>
        </div>
    </div>

    <footer>
        © 2007 ちく · 原作 freeware ｜ © 2026 thc1006 · 中文化 + JS port MIT ｜
        <a href="../">回首頁</a> ｜
        <a href="https://github.com/thc1006/mariocat-zh-tw" target="_blank" rel="noopener">原始碼</a>
    </footer>
</div>

<script src="game.js"></script>
</body>
</html>
